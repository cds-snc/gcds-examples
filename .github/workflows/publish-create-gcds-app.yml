name: Publish @gcds-core/create-app

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-gcds-app
    steps:
      - name: Git Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/create-gcds-app/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Show npm config
        run: npm config list

      - name: Show relevant environment
        run: env | sort | grep -E 'NPM|NODE|ACTIONS|GITHUB'

      - name: Publish to npm
        run: npm publish --provenance --access public
